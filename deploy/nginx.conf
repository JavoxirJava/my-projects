server {
    listen 80;
    listen [::]:80;
    server_name my-projects.javohir-dev.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/my-projects-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my-projects.javohir-dev.uz;
    ssl_certificate /etc/letsencrypt/live/my-projects.javohir-dev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-projects.javohir-dev.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://127.0.0.1:4350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
