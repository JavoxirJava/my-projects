# Zones have unique names and are only applied by this project's virtual host.
limit_req_zone $binary_remote_addr zone=myprojects_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=myprojects_api:2m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=myprojects_connections:1m;
server {
    listen 80;
    listen [::]:80;
    server_name my-projects.javohir-dev.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/my-projects-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name my-projects.javohir-dev.uz;
    ssl_certificate /etc/letsencrypt/live/my-projects.javohir-dev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-projects.javohir-dev.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn myprojects_connections 12;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    location = /api/auth/login {
        client_max_body_size 8k;
        limit_req zone=myprojects_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4350;
    }
    location ~ ^/api/restore(?:/preview)?$ {
        client_max_body_size 21m;
        limit_req zone=myprojects_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:4350;
    }
    location /api/ {
        limit_req zone=myprojects_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4350;
    }
    location / { proxy_pass http://127.0.0.1:4350; }
}
