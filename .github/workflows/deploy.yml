name: Verify and deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: my-projects-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: my_projects_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-test-password@127.0.0.1:5432/my_projects_test
      - run: npm run build
      - run: bash deploy/package.sh "$GITHUB_SHA"
      - name: Install isolated deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      - name: Upload and activate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy -o IdentitiesOnly=yes "artifacts/$GITHUB_SHA.tar.gz" "$VPS_USER@$VPS_HOST:/srv/my-projects/incoming/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/my-projects-apply-release $GITHUB_SHA"
      - name: Verify public HTTPS
        run: curl --fail --retry 5 --retry-delay 3 https://my-projects.javohir-dev.uz/api/health
